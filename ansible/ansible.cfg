[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
retry_files_enabled = False
interpreter_python = auto_silent
timeout            = 30
# The vault password file is provided by deploy.sh through ANSIBLE_VAULT_PASSWORD_FILE (.vault_pass, git-ignored).

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
retries    = 3
