---
# Non-secret settings shared by all roles.

db_name: appdb
db_user: appuser
db_port: 5432
db_container_name: postgres

# Secret: comes from the encrypted vault.yml (generated by deploy.sh, never committed).
db_password: "{{ vault_postgres_password }}"

# Host firewall (ufw). Set to false to skip it; the AWS Security Groups stay active either way.
common_enable_ufw: true
