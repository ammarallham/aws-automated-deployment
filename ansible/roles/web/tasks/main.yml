---
- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ web_app_dir }}"
    - "{{ web_app_dir }}/flask"
    - "{{ web_app_dir }}/nginx"

- name: Copy the Flask application (Dockerfile, requirements, code)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/flask/{{ item }}"
    dest: "{{ web_app_dir }}/flask/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ web_flask_files }}"
  notify: Rebuild and recreate the web stack

- name: Copy the Nginx configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/nginx/default.conf"
    dest: "{{ web_app_dir }}/nginx/default.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Write the Docker Compose file for Flask + Nginx
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ web_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write the secrets file (.env) from Ansible Vault
  ansible.builtin.template:
    src: env.j2
    dest: "{{ web_app_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Allow HTTP through the host firewall
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: common_enable_ufw | bool

- name: Start Flask + Nginx with Docker Compose (builds the Flask image if it does not exist)
  community.docker.docker_compose_v2:
    project_src: "{{ web_app_dir }}"
    project_name: webapp
    state: present
    build: policy

- name: Apply pending restarts/rebuilds before testing
  ansible.builtin.meta: flush_handlers

- name: Wait for Nginx to listen on port 80
  ansible.builtin.wait_for:
    port: 80
    timeout: 60

- name: Smoke test - /health must return 200 (web -> Flask -> Postgres)
  ansible.builtin.uri:
    url: http://127.0.0.1/health
    status_code: 200
  register: web_health
  retries: 15
  delay: 4
  until: web_health.status == 200
