---
- name: Install python3-debian (needed by the deb822_repository module)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Add Docker's official apt repository (with its signing key)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  notify: Update apt cache

- name: Refresh the apt cache now if the repository was just added
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    lock_timeout: 300

- name: Start Docker and enable it at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the SSH user to run docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
