---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Harden SSH (no root login, no passwords)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Make sure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Allow SSH through the host firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: common_enable_ufw | bool

- name: Enable the host firewall (deny all other incoming traffic)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: common_enable_ufw | bool
